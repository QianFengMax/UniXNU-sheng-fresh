name: userdata

# Build only the userdata-root.img (and userdata-root.json) for an OS profile on a
# macOS runner (using macOS /usr/bin/aea, /usr/bin/hdiutil and blacktop/tap/ipsw)
# and upload it compressed with zstd (--sparse).

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the userdata root image"
        type: choice
        options: ["27", "26", "17"]
        default: "27"

permissions:
  contents: read

concurrency:
  group: userdata-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: true

jobs:
  userdata:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      UNIXNU_IPSW_JOBS: 16
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 563595abedfdfa413ad583b66b6176d82007e633
          path: UniXNU
          submodules: false
      - name: tools
        run: |
          brew install blacktop/tap/ipsw zstd
          df -h
      - name: build userdata
        env:
          OS_PROFILE: ${{ inputs.os }}
        run: |
          set -o pipefail
          df -h
          python3 UniXNU/unixnu build userdata -D device --os "$OS_PROFILE" 2>&1 | tee /tmp/userdata-build.log
          status=$?
          df -h
          echo "userdata build exit=$status"
          exit $status
      - name: package the image
        run: |
          set -e
          df -h
          # Reclaim ~20 GiB of extracted/decrypted IPSW archives before compressing.
          rm -rf UniXNU/out/ipsw
          mkdir -p artifacts
          img=$(ls UniXNU/out/sheng/*/*/userdata/userdata-root.img)
          meta=$(ls UniXNU/out/sheng/*/*/userdata/userdata-root.json)
          cp "$meta" artifacts/userdata-root.json
          zstd -T0 -3 --sparse "$img" -o artifacts/userdata-root.img.zst
          rm -f "$img"
          ls -lh artifacts/
          df -h
      - name: upload userdata
        uses: actions/upload-artifact@v4
        with:
          name: userdata-root-${{ inputs.os }}
          retention-days: 3
          if-no-files-found: error
          path: |
            artifacts/userdata-root.img.zst
            artifacts/userdata-root.json
      - name: failure diagnostics
        if: failure()
        run: |
          echo "=== df -h ==="
          df -h
          echo "=== build log tail ==="
          tail -n 200 /tmp/userdata-build.log 2>/dev/null || echo "(no build log)"
          echo "=== out tree ==="
          find UniXNU/out -maxdepth 5 2>/dev/null | head -80
          echo "=== firmware cache ==="
          ls -la device/.cache/firmware 2>/dev/null | head -40
          echo "=== target volumes ==="
          ls -la UniXNU/out/ipsw 2>/dev/null | head -20
      - name: upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-logs-${{ inputs.os }}
          retention-days: 5
          path: |
            /tmp/userdata-build.log
